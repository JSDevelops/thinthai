name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & Access Control Tests
        run: npm test

      - name: Build applications
        run: npm run build

      - name: Audit dependencies
        run: npm audit --omit=dev

  integration:
    name: Isolated API and database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: thinthai
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: thinthai_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U thinthai -d thinthai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://thinthai:ci-test-only@127.0.0.1:55433/thinthai_test
      WEB_ORIGIN: http://127.0.0.1:3200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
